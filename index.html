<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F1"><meta name="description" content="个人咖啡冲煮记录">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>我的咖啡</title>
<style>
:root{--bg:#F7F5F1;--card:#fff;--text:#262522;--sec:#6F6B63;--ter:#9B978F;--border:#E9E6E0;--rating:#8A5A3B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:30px}.page{padding:20px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:22px;line-height:28px;font-weight:600;margin:0}.plus{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:24px}.back,.textbtn{border:0;background:transparent;padding:8px 4px;color:var(--sec);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px}.row1{font-size:14px;line-height:20px;font-weight:500}.row2{margin-top:4px;font-size:13px;line-height:18px;color:var(--sec);font-weight:500}.row3{margin-top:4px;font-size:13px;line-height:18px;font-weight:500}.row4{margin-top:7px;font-size:13px;line-height:18px}.row5{margin-top:6px;font-size:11px;line-height:16px;color:var(--ter)}.rating{color:var(--rating);font-weight:600}.note{color:var(--sec)}.beanname{font-size:15px;font-weight:600}.beansub{margin-top:4px;font-size:13px;color:var(--sec)}.beandate{margin-top:5px;font-size:11px;color:var(--ter)}
.empty{text-align:center;color:var(--ter);padding:48px 10px;font-size:14px}.primary,.danger{width:100%;padding:12px;border-radius:10px;font-weight:600}.primary{border:0;background:var(--text);color:#fff}.danger{border:1px solid var(--border);background:#fff;color:#8B3D32}
.form{display:flex;flex-direction:column;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--sec);font-weight:500}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);padding:11px 12px;outline:0}.field textarea{min-height:88px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:11px;color:var(--sec)}.seg .active{background:#EFECE6;color:var(--text);font-weight:600}.computed{font-size:13px;color:var(--sec);margin-top:-8px}.computed strong{color:var(--text)}.stars{display:flex;gap:4px}.star{border:0;background:transparent;padding:2px;font-size:27px;color:#D7D2C9}.star.on{color:var(--rating)}
.detailbean{font-size:18px;line-height:24px;font-weight:600}.detailsub{margin-top:5px;font-size:13px;color:var(--sec)}.section{margin-top:24px}.section h2{font-size:15px;margin:0 0 12px}.params{border-top:1px solid var(--border)}.param{display:grid;grid-template-columns:1fr 1fr;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}.param .l{color:var(--sec)}.param .v{text-align:right;font-weight:500}.score{font-size:22px;font-weight:600;color:var(--rating)}.tasting{font-size:14px;line-height:22px;color:var(--sec);white-space:pre-wrap;margin-top:12px}.highlight{margin-top:12px;font-weight:600;font-size:14px}.info{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.infoitem{padding:10px 0;border-bottom:1px solid var(--border)}.infoitem .l{font-size:11px;color:var(--ter)}.infoitem .v{margin-top:3px;font-size:14px}.actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px}
</style></head>
<body><div id="app"></div>
<script>
const DB="coffee-brew-online", VER=1;
let state={beans:[],brews:[]};
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains("beans"))d.createObjectStore("beans",{keyPath:"id"});if(!d.objectStoreNames.contains("brews")){let s=d.createObjectStore("brews",{keyPath:"id"});s.createIndex("date","brewDate")}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function store(name,mode,action){return openDB().then(db=>new Promise((res,rej)=>{let tx=db.transaction(name,mode),s=tx.objectStore(name),r=action(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);tx.oncomplete=()=>db.close()}))}
const api={all:n=>store(n,"readonly",s=>s.getAll()),get:(n,id)=>store(n,"readonly",s=>s.get(id)),put:(n,x)=>store(n,"readwrite",s=>s.put(x)),del:(n,id)=>store(n,"readwrite",s=>s.delete(id))};
const uid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10);
const dateCN=d=>{if(!d)return"";let x=new Date(d+"T00:00:00");return (x.getMonth()+1)+"月"+x.getDate()+"日"};
const days=(a,b)=>{if(!a||!b)return;let n=Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);return n>=0?n:undefined};
const ratio=(c,w)=>c&&w?(w/c).toFixed(1).replace(/\.0$/,""):"—";
const bt=s=>s==null?"—":Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const parseTime=s=>{let m=String(s||"").match(/^(\d+):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):undefined};
const beanMap=beans=>new Map(beans.map(x=>[x.id,x]));
async function seed(){let b=await api.all("beans");if(b.length)return;let now=new Date().toISOString(),bean={id:uid(),name:"埃塞俄比亚 Bensa 74158",origin:"埃塞俄比亚",region:"Bensa",process:"水洗",variety:"74158",altitude:2200,roastDate:"2026-09-20",roastLevel:"浅烘焙",roaster:"我的烘焙",createdAt:now,updatedAt:now};await api.put("beans",bean);await api.put("brews",{id:uid(),beanId:bean.id,brewDate:"2026-10-05",method:"V60",coffeeWeight:15,waterWeight:240,temperature:92,grinder:"C40 MK3",grindSize:"35格",brewTime:165,type:"hot",score:4.5,tastingNote:"花香明显，甜感很好，尾段略干。",createdAt:now,updatedAt:now})}
function header(title,add){return `<div class="header"><h1 class="title">${title}</h1>${add||""}</div>`}
function brewCard(b,bean){let line=[bean?.origin,bean?.name?.replace((bean?.origin||"")+" ","")||bean?.name,bean?.process].filter(Boolean).join(" · "),gr=[b.grinder,b.grindSize].filter(Boolean).join(" · "),d=days(bean?.roastDate,b.brewDate);return `<button class="card" onclick="go('#/brews/${b.id}')"><div class="row1">${esc(line||"未命名豆子")}</div>${gr?`<div class="row2">${esc(gr)}</div>`:""}<div class="row3">${esc(b.method)} · ${b.coffeeWeight}g · 1:${ratio(b.coffeeWeight,b.waterWeight)}${b.temperature?` · ${b.temperature}°C`:""} · ${b.type==="iced"?"冰":"热"}</div>${b.score!=null||b.tastingNote?`<div class="row4">${b.score!=null?`<span class="rating">★ ${Number(b.score).toFixed(1)}</span>`:""}${b.score!=null&&b.tastingNote?" · ":""}${b.tastingNote?`<span class="note">${esc(b.tastingNote)}</span>`:""}</div>`:""}<div class="row5">${d!=null?`烘焙后第${d}天 · `:""}${dateCN(b.brewDate)}</div></button>`}
async function pageBrews(){let [bs,beans]=await Promise.all([api.all("brews"),api.all("beans")]);bs.sort((a,b)=>b.brewDate.localeCompare(a.brewDate));let m=beanMap(beans);$("#app").innerHTML=`<div class="page">${header("我的冲煮",'<button class="plus" onclick="go(\'#/brews/new\')">+</button>')}<div class="stack">${bs.length?bs.map(b=>brewCard(b,m.get(b.beanId))).join(""):'<div class="empty">还没有冲煮记录<br>点击右上角 + 开始记录</div>'}</div></div>`}
async function pageBeans(){let bs=await api.all("beans");bs.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));$("#app").innerHTML=`<div class="page">${header("我的豆子",'<button class="plus" onclick="go(\'#/beans/new\')">+</button>')}<div class="stack">${bs.length?bs.map(b=>`<button class="card" onclick="go('#/beans/${b.id}')"><div class="beanname">${esc(b.name)}</div><div class="beansub">${esc([b.process,b.variety,b.altitude?b.altitude+"m":""].filter(Boolean).join(" · ")||"暂无详细参数")}</div>${b.roastDate?`<div class="beandate">${b.roastDate} 烘焙</div>`:""}</button>`).join(""):'<div class="empty">还没有豆子<br>点击右上角 + 添加第一支豆子</div>'}</div></div>`}
function back(label="返回"){return `<button class="back" onclick="history.back()">‹ ${label}</button>`}
function field(label,name,value="",type="text",ph=""){return `<div class="field"><label>${label}</label><input id="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}"></div>`}
async function pageBeanForm(){let html=`<div class="page">${back("我的豆子")}${header("添加豆子")}<form class="form" onsubmit="saveBean(event)">${field("豆名 *","name","","text","例如：埃塞俄比亚 Bensa 74158")}${field("产地","origin","","text","埃塞俄比亚")}${field("产区","region")}${field("烘焙商","roaster")}${field("处理法","process","","text","水洗")}${field("品种","variety")}${field("海拔（m）","altitude","","number")}${field("烘焙日期","roastDate",today(),"date")}<div class="field"><label>烘焙度</label><select id="roastLevel"><option>浅烘焙</option><option>中浅烘焙</option><option>中烘焙</option><option>中深烘焙</option><option>深烘焙</option></select></div><div class="field"><label>备注</label><textarea id="notes"></textarea></div><button class="primary">保存豆子</button></form></div>`;$("#app").innerHTML=html}
async function saveBean(e){e.preventDefault();let g=id=>$("#"+id)?.value.trim();let name=g("name");if(!name)return;let now=new Date().toISOString();await api.put("beans",{id:uid(),name,origin:g("origin"),region:g("region"),roaster:g("roaster"),process:g("process"),variety:g("variety"),altitude:g("altitude")?Number(g("altitude")):undefined,roastDate:$("#roastDate").value,roastLevel:$("#roastLevel").value,notes:g("notes"),createdAt:now,updatedAt:now});go("#/beans")}
async function pageBean(id){let [b,brews]=await Promise.all([api.get("beans",id),api.all("brews")]);if(!b){$("#app").innerHTML=`<div class="page">${back("我的豆子")}<div class="empty">豆子不存在</div></div>`;return}brews=brews.filter(x=>x.beanId===id).sort((a,c)=>c.brewDate.localeCompare(a.brewDate));let sub=[b.origin,b.region].filter(Boolean).join(" · ");$("#app").innerHTML=`<div class="page">${back("我的豆子")}<div class="header"><span></span><button class="textbtn" onclick="go('#/brews/new?bean=${id}')">+ 冲煮</button></div><div class="detailbean">${esc(b.name)}</div>${sub?`<div class="detailsub">${esc(sub)}</div>`:""}<section class="section"><h2>豆子信息</h2><div class="info">${[["产地",b.origin],["产区",b.region],["处理法",b.process],["品种",b.variety],["海拔",b.altitude?b.altitude+"m":""],["烘焙商",b.roaster],["烘焙日期",b.roastDate],["烘焙度",b.roastLevel]].map(x=>`<div class="infoitem"><div class="l">${x[0]}</div><div class="v">${esc(x[1]||"—")}</div></div>`).join("")}</div></section><section class="section"><h2>我的冲煮　${brews.length} 次</h2><div class="stack">${brews.length?brews.map(x=>brewCard(x,b)).join(""):'<div class="empty">还没有这支豆子的冲煮记录</div>'}</div></section></div>`}
function getQuery(){return new URLSearchParams(location.hash.split("?")[1]||"")}
async function pageBrewForm(edit=false,id){let beans=await api.all("beans"),old=edit?await api.get("brews",id):null,q=getQuery();let f=old||{beanId:q.get("bean")||"",method:"V60",brewDate:today(),type:"hot"};$("#app").innerHTML=`<div class="page">${back(edit?"冲煮详情":"我的冲煮")}${header(edit?"编辑冲煮":"添加冲煮")}<form class="form" onsubmit="saveBrew(event,${edit},'${id||""}')"><div class="field"><label>豆子 *</label><select id="beanId" required><option value="">选择豆子</option>${beans.map(b=>`<option value="${b.id}" ${b.id===f.beanId?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>${!beans.length?'<div class="computed">还没有豆子，请先添加豆子。</div>':""}<div class="field"><label>冲煮方式 *</label><select id="method">${["V60","Kalita","Origami","AeroPress","French Press","Espresso","其他"].map(x=>`<option ${x===f.method?"selected":""}>${x}</option>`).join("")}</select></div><div class="grid2">${field("粉量（g）*","coffeeWeight",f.coffeeWeight||"","number")} ${field("水量（g）*","waterWeight",f.waterWeight||"","number")}</div><div class="computed">粉水比　<strong id="ratio">—</strong></div>${field("水温（°C）","temperature",f.temperature||"","number")}${field("磨豆机","grinder",f.grinder||"","text","C40 MK3")}${field("研磨度","grindSize",f.grindSize||"","text","35格")}${field("冲煮时间","brewTime",f.brewTime!=null?bt(f.brewTime):"","text","2:45")}<div class="field"><label>类型</label><div class="seg"><button type="button" id="hot" class="${f.type!=="iced"?"active":""}" onclick="setType('hot')">热</button><button type="button" id="iced" class="${f.type==="iced"?"active":""}" onclick="setType('iced')">冰</button></div></div><div class="field"><label>口味评价</label><div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${Number(f.score||0)>=n?"on":""}" onclick="setScore(${n})">★</button>`).join("")}</div><div class="computed" id="scoreText">${f.score!=null?"★ "+Number(f.score).toFixed(1):"未评分"}</div></div><div class="field"><label>口味描述</label><textarea id="tastingNote" placeholder="花香明显，甜感很好，尾段略干……">${esc(f.tastingNote||"")}</textarea></div>${field("冲煮日期","brewDate",f.brewDate||today(),"date")}<input type="hidden" id="type" value="${f.type||"hot"}"><input type="hidden" id="score" value="${f.score||""}"><button class="primary">${edit?"保存修改":"保存冲煮"}</button></form></div>`;["coffeeWeight","waterWeight"].forEach(id=>$("#"+id).addEventListener("input",updateRatio));updateRatio()}
function updateRatio(){let c=Number($("#coffeeWeight")?.value),w=Number($("#waterWeight")?.value);$("#ratio").textContent=c&&w?"1 : "+ratio(c,w):"—"}
function setType(t){$("#type").value=t;$("#hot").classList.toggle("active",t==="hot");$("#iced").classList.toggle("active",t==="iced")}
function setScore(n){let old=Number($("#score").value);$("#score").value=old===n?"":n;let v=Number($("#score").value);document.querySelectorAll(".star").forEach((x,i)=>x.classList.toggle("on",v>=i+1));$("#scoreText").textContent=v?"★ "+v.toFixed(1):"未评分"}
async function saveBrew(e,edit,id){e.preventDefault();let v=x=>$("#"+x)?.value.trim(),c=Number(v("coffeeWeight")),w=Number(v("waterWeight"));if(!v("beanId")||!c||!w)return;let now=new Date().toISOString(),old=edit?await api.get("brews",id):null;await api.put("brews",{id:edit?id:uid(),beanId:v("beanId"),brewDate:v("brewDate")||today(),method:v("method"),coffeeWeight:c,waterWeight:w,temperature:v("temperature")?Number(v("temperature")):undefined,grinder:v("grinder"),grindSize:v("grindSize"),brewTime:parseTime(v("brewTime")),type:$("#type").value,score:v("score")?Number(v("score")):undefined,tastingNote:v("tastingNote"),createdAt:old?.createdAt||now,updatedAt:now});go(edit?"#/brews/"+id:"#/brews")}
async function pageBrew(id){let b=await api.get("brews",id),bean=b?await api.get("beans",b.beanId):null;if(!b||!bean){$("#app").innerHTML=`<div class="page">${back("我的冲煮")}<div class="empty">记录不存在</div></div>`;return}let sub=[bean.process,bean.variety,bean.altitude?bean.altitude+"m":""].filter(Boolean).join(" · "),d=days(bean.roastDate,b.brewDate);$("#app").innerHTML=`<div class="page">${back("我的冲煮")}<div class="header"><span></span><button class="textbtn" onclick="go('#/brews/${b.id}/edit')">编辑</button></div><div class="detailbean">${esc(bean.origin?bean.origin+" · ":"")}${esc(bean.name)}</div>${sub?`<div class="detailsub">${esc(sub)}</div>`:""}<section class="section"><h2>冲煮参数</h2><div class="params">${[["冲煮方式",b.method],["粉量",b.coffeeWeight+" g"],["水量",b.waterWeight+" g"],["粉水比","1 : "+ratio(b.coffeeWeight,b.waterWeight)],["水温",b.temperature?b.temperature+"°C":"—"],["类型",b.type==="iced"?"冰":"热"],["磨豆机",b.grinder||"—"],["研磨度",b.grindSize||"—"],["冲煮时间",bt(b.brewTime)]].map(x=>`<div class="param"><span class="l">${x[0]}</span><span class="v">${esc(x[1])}</span></div>`).join("")}</div></section><section class="section"><h2>口味评价</h2><div class="score">${b.score!=null?"★ "+Number(b.score).toFixed(1):"未评分"}</div>${b.tastingNote?`<div class="tasting">${esc(b.tastingNote)}</div>`:""}</section><section class="section"><h2>时间</h2><div class="params"><div class="param"><span class="l">烘焙日期</span><span class="v">${esc(bean.roastDate||"—")}</span></div><div class="param"><span class="l">冲煮日期</span><span class="v">${esc(b.brewDate)}</span></div></div>${d!=null?`<div class="highlight">烘焙后第${d}天</div>`:""}</section><div class="actions"><button class="primary" onclick="go('#/brews/${b.id}/edit')">编辑冲煮</button><button class="danger" onclick="deleteBrew('${b.id}')">删除这条冲煮记录</button></div></div>`}
async function deleteBrew(id){if(confirm("删除这条冲煮记录？删除后无法恢复。")){await api.del("brews",id);go("#/brews")}}
function home(){$("#app").innerHTML=`<div class="page">${header("我的咖啡")}<div class="stack"><button class="card" onclick="go('#/beans')"><div class="beanname">我的豆子</div><div class="beansub">管理咖啡豆与烘焙信息</div></button><button class="card" onclick="go('#/brews')"><div class="beanname">我的冲煮</div><div class="beansub">记录参数、评分与口味</div></button></div></div>`}
function go(h){location.hash=h;render()}
async function render(){let p=location.hash.replace(/^#/,"")||"/";if(p==="/")return home();if(p==="/beans")return pageBeans();if(p==="/beans/new")return pageBeanForm();if(p.startsWith("/beans/"))return pageBean(p.split("/")[2]);if(p==="/brews")return pageBrews();if(p==="/brews/new")return pageBrewForm(false);if(p.endsWith("/edit"))return pageBrewForm(true,p.split("/")[2]);if(p.startsWith("/brews/"))return pageBrew(p.split("/")[2])}
seed().then(render);window.addEventListener("hashchange",render);
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
